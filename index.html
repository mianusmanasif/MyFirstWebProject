<!DOCTYPE html>
<html>
    <head>
        <title>My Web Page</title>
    </head>
    <body style="background-color: lightgray;">
        <h2 style="color: red;"> Continental Hotel Reservation Form</h2>
        <form>
            <table style="font-size: 18px;border: 1px solid black; background-color: aqua;">
                <tr>
                    <td style="border: 1px solid black;">Name:</td><td style="border: 1px solid black;"><input type="text" name="name" placeholder="Enter Name"></td>
                </tr>
                <tr>
                    <td style="border: 1px solid black;">eMail:</td><td style="border: 1px solid black;"><input type="email" name="email" placeholder="Enter email"></td>
                </tr> 
                <tr>
                    <td style="border: 1px solid black;">Phone:</td><td style="border: 1px solid black;"><input type="tel" name="Mobile" placeholder="Enter Mobile Number"></td>
                </tr> 
                <tr>
                    <td style="border: 1px solid black;">Arrival time:</td><td style="border: 1px solid black;"><input type="time" name="time" placeholder="Enter Arrival Time"></td>
                </tr>
                <tr>
                    <td style="border: 1px solid black;">Departure Date:</td><td style="border: 1px solid black;"><input type="date" name="date"></td>
                </tr>
                <tr>
                    <td style="border: 1px solid black;">Room Type:</td><td style="border: 1px solid black;"><input type="radio" name="Room" value="single">Single<br><input type="radio" name="Room" value="double">Double<br><input type="radio" name="Room" value="Presidential Suite">Presidential Suite</td>
                </tr>
                <tr>
                    <td style="border: 1px solid black;">Preferences:</td><td style="border: 1px solid black;"><input type="checkbox" name="Preferences" value="non-smoking">Non-Smoking<br><input type="checkbox" name="Preferences" value="Internet">Internet<br><input type="checkbox" name="Preferences" value="Firm Mattress">Firm Mattress<br></td>
                </tr>
                <tr>
                    <td style="border: 1px solid black;">Mode of Payment:</td><td style="border: 1px solid black;"><input type="radio" name="radio" value="cash">Cash<br><input type="radio" name="radio" value="check">Check<br><input type="radio" name="radio" value="Credit Card">Credit Card<br></td>
                </tr>
                <tr>
                    <td><input type="submit" value="Sumbit Form"></td>
                </tr>
            </table>
        </form>
        
    </body>
</html>
